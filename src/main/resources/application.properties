spring.application.name=SalonManagementSystem
server.port=8081
server.servlet.context-path=/salon-app

# =============================================================================
# MYSQL CONNECTION (server login — NOT app user login)
# Override on another machine with environment variables:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# App login users (admin, cashier, etc.) are created by DataSeeder.java
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:SalonMangement}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Creates/updates tables automatically on startup (no manual SQL scripts needed)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
